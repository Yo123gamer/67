<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Notes Download</title>
  <!-- Authentic Minecraft Font -->
  <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated; /* Forces crisp pixel-art scaling */
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Minecraft', monospace;
      
      /* Real Minecraft Dirt Texture (seamless base64 pattern) */
      background-color: #573d26;
      background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSU6BAAAAAAALAAAAAABAAEAAAICRAEAOw==');
      background-image: url("https://minecraft.wiki/images/Dirt_%28texture%29_JE6_BE3.png");
      background-size: 64px 64px;
      color: #ffffff;
    }

    /* Dark Overlay Container for HUD look */
    .mc-menu {
      background-color: rgba(0, 0, 0, 0.75);
      border: 4px solid #000;
      box-shadow: inset -4px -4px 0px #3c3c3c, inset 4px 4px 0px #a0a0a0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90%;
      width: 480px;
    }

    .mc-title {
      font-size: 20px;
      color: #FFFF55;
      text-shadow: 3px 3px 0px #3F3F00, 3px 3px 0px #000;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Genuine Minecraft UI Button Texture */
    .mc-button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 50px;
      text-decoration: none;
      color: #E0E0E0;
      font-size: 16px;
      text-shadow: 2px 2px 0px #3F3F3F;
      cursor: pointer;
      
      /* Pure Minecraft Stone Button Texture CSS simulation */
      background: #8B8B8B;
      border-top: 4px solid #C6C6C6;
      border-left: 4px solid #C6C6C6;
      border-right: 4px solid #555555;
      border-bottom: 4px solid #555555;
      box-shadow: 0 4px 0 #000;
      box-sizing: border-box;
      transition: filter 0.05s;
    }

    .mc-button:hover {
      background: #A0A0A0;
      color: #FFFFA0;
      text-shadow: 2px 2px 0px #3F3F00;
      border-top: 4px solid #E0E0E0;
      border-left: 4px solid #E0E0E0;
      border-right: 4px solid #3A3A3A;
      border-bottom: 4px solid #3A3A3A;
    }

    .mc-button:active {
      border-top: 4px solid #555555;
      border-left: 4px solid #555555;
      border-right: 4px solid #C6C6C6;
      border-bottom: 4px solid #C6C6C6;
      background: #707070;
      box-shadow: none;
      transform: translateY(4px);
    }

    /* Item Frame Preview Styling */
    .item-frame {
      margin-top: 25px;
      background-color: #2D1A0A;
      border: 4px solid #180D05;
      box-shadow: inset 0 0 10px #000;
      padding: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .item-frame img {
      max-width: 100%;
      max-height: 250px;
      border: 2px solid #000;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="mc-menu">
    <h1 class="mc-title">Sanskrit Class-IX Notes</h1>

    <!-- Minecraft Style Button Link -->
    <a href="IMG-20260820-WA0016.jpg" download="Sanskrit_Class9_Notes.jpg" class="mc-button">
      Download Notes
    </a>

    <!-- Preview inside a Minecraft style frame -->
    <div class="item-frame">
      <img src="IMG-20260820-WA0016.jpg" alt="Sanskrit Notes">
    </div>
  </div>

</body>
</html>
